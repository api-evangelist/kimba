aid: kimba
name: Kimba
description: >-
  Kimba is an AI-powered sleep technology company building a bedside device that
  uses personalized scent therapy to improve sleep quality. The device reads
  biometric data from wearables (Oura, WHOOP, Apple Watch, Garmin), monitors sleep
  architecture, breathing, movement and disturbances, and releases natural,
  water-based scent formulations at precise moments in the sleep cycle to enhance
  rest, reduce nighttime disruptions and support cognitive performance. Kimba is a
  Techstars-backed direct-to-consumer hardware and subscription brand whose online
  store runs on Shopify; it exposes an agent-facing commerce surface via the
  Universal Commerce Protocol (UCP), a hosted MCP endpoint, and Shopify Customer
  Account API (OIDC) authentication rather than a traditional developer API.
